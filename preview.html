/* MAX it v4 — "Poster". À charger APRÈS style.css. Couleurs = tokens --brand-* existants. */

/* ---- Signature shapes : arc · points · losange · rayures ---- */
.sh{position:absolute;pointer-events:none;z-index:0}
.sh.arc{top:0;right:0;width:150px;height:150px;border-radius:0 0 0 100%;background:var(--brand-primary)}

.sh.dots{left:0;bottom:0;width:130px;height:110px;color:#ffffff38;background:radial-gradient(currentColor 1.6px,transparent 2.2px) 0 0/16px 16px}
.sh.loz{width:84px;height:84px;border:3px solid var(--brand-primary);border-radius:22px;transform:rotate(45deg)}
.sh.stripes{right:0;top:0;width:46%;height:100%;color:#ffffff22;background:repeating-linear-gradient(135deg,currentColor 0 2px,transparent 2px 12px)}
.bx>:not(.sh),.qrhero>:not(.sh){position:relative;z-index:1}

/* ---- Navigation : scanner central ---- */
#nav{border-top:0;box-shadow:0 -10px 30px -20px #0008}

@media(min-width:900px){#nav{box-shadow:none}#nav .scanbtn{justify-content:flex-start}#nav .scanbtn i{width:44px;height:44px;margin:0;box-shadow:none;font-size:1.3rem}}

function render(f=true){const r=S.r;$('#view').innerHTML=VW[r]();document.body.classList.toggle('auth',AUTH.has(r));$('#nav').hidden=AUTH.has(r)||r==='ok';
$$('#nav button').forEach(b=>b.dataset.tab===TABOF[r]?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
if(r==='notifs')S.unread=0;$('#bell .dot').hidden=!S.unread;
if(f!==false){scrollTo(0,0);const h=$('#view h1');h&&h.focus({preventScroll:true});if(!matchMedia('(prefers-reduced-motion:reduce)').matches)$$('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now(),fn=t=>{const k=Math.min(1,(t-t0)/700);el.textContent=F(to*(1-(1-k)**3));if(k<1)requestAnimationFrame(fn)};requestAnimationFrame(fn)})}}
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)};
const sheet=(t,b)=>{const d=$('#sheet');d.innerHTML=`<h2>${t}</h2>${b}<button class="btn light" data-a="close" style="margin-top:12px">Annuler</button>`;d.showModal()};
const TK='sj-theme',curTheme=()=>{try{return localStorage.getItem(TK)||'auto'}catch(e){return'auto'}},isDark=()=>{const t=curTheme();return t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches)};
function applyTheme(t,spin){const r=document.documentElement;r.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t;if(spin){r.classList.add('tx');setTimeout(()=>r.classList.remove('tx'),400)}const b=$('#tt');b.innerHTML=ic(isDark()?'sun':'moon');b.setAttribute('aria-label',isDark()?'Passer en mode clair':'Passer en mode sombre');if(spin){b.classList.remove('sp');void b.offsetWidth;b.classList.add('sp')}}
const rev=(k,items)=>{S.tx={k,items};nav('review')};
const A={back:()=>{[S.r,S.p]=S.st.pop()||['home',{}];render()},hide:()=>{S.hide=!S.hide;render(false)},close:()=>$('#sheet').close(),
simple:()=>{S.simple=!S.simple;render(false);toast(S.simple?'Mode Simple activé':'Mode Simple désactivé')},flt:d=>{S.f=d.f;render(false)},
theme:d=>{try{d.t==='auto'?localStorage.removeItem(TK):localStorage.setItem(TK,d.t)}catch(e){}applyTheme(d.t,true);if(S.r==='more')render(false)},tt:()=>A.theme({t:isDark()?'light':'dark'}),
to:d=>{S.tx={to:[+d.id]};nav('amount')},qa:d=>{$('#am').value=d.v},

confirm:()=>{if(total()>S.bal)return er(need(total()));S.busy=true;render(false);setTimeout(()=>{const t=total(),k=S.tx.k;S.bal-=t;S.count+=S.tx.items.length;S.tx.items.forEach(i=>S.hist.unshift({d:0,t:i.n,a:-i.a,k}));const n=S.tx.items.map(i=>i.n);

eye:d=>{const i=$('#'+d.for),b=document.querySelector(`[data-for="${d.for}"]`),show=i.type==='password',ei=b.querySelector('.ei');i.type=show?'text':'password';b.setAttribute('aria-pressed',show);b.setAttribute('aria-label',show?'Masquer le mot de passe':'Afficher le mot de passe');ei.innerHTML=ic(show?'eyeoff':'eye');b.querySelector('.et').textContent=show?'Masquer':'Afficher';ei.classList.remove('pop');void ei.offsetWidth;ei.classList.add('pop');i.focus()},
